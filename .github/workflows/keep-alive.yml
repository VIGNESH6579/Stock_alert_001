name: Render Keep-Alive (market hours)

on:
  schedule:
    # Every 5 minutes, Mon-Fri. IST = UTC + 5:30.
    # NSE 09:15-15:30 IST = 03:45-10:00 UTC.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render service
        run: |
          curl -s --max-time 30 -f -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://oi-edge-alerts.onrender.com/health" || true
